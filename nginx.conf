server {
    listen 3000;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # HTML, CSS, JS và manifest.json không có hash trong tên file: luôn hỏi lại server (ETag) để bản deploy mới có hiệu lực ngay.
    location / {
        try_files $uri $uri/ =404;
        add_header Cache-Control "no-cache";
    }

    location ~ manifest\.json$ {
        add_header Cache-Control "no-cache";
    }

    # Frame WebP và ảnh: nặng, ít đổi, cache 7 ngày.
    location ~ ^/(frames|assets)/ {
        add_header Cache-Control "public, max-age=604800";
    }
}
