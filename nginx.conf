server {
    listen 3000;
    server_name _;
    root /usr/share/nginx/html;
    index phu-gam.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # HTML, CSS, JS không có hash trong tên file: luôn hỏi lại server (ETag) để bản deploy mới có hiệu lực ngay.
    location / {
        try_files $uri $uri/ =404;
        add_header Cache-Control "no-cache";
    }

    # Ảnh, mô hình 3D, âm thanh: nặng, ít đổi, cache 7 ngày (đổi file thì tăng ?v= ở chỗ gọi).
    location ~ ^/assets/ {
        add_header Cache-Control "public, max-age=604800";
    }
}
